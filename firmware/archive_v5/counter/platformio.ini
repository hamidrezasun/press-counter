; Press counter - machine controller: bare STM32F103C8T6 on the v5 MAIN board.
;
; The build that is verified is firmware/tools/build_stm32.sh (arduino-cli + STM32duino core 3.0.0): see docs/FIRMWARE.md.
; This file carries the same flags for PlatformIO; it has NOT been run by the author.
;
;   pio run -e stm32_stlink -t upload       flash through the SWD header J9 with an ST-Link V2
;   pio run -e stm32_uart   -t upload       flash through the ROM bootloader on USART1 (USB-UART adapter on H1 / the ESP link, BOOT0 high)
;                                           - the gateway (ESP8266) can do the same over WiFi, see docs/FIRMWARE.md

[env]
platform = ststm32
framework = arduino
board = genericSTM32F103C8
lib_deps =
    miguelbalboa/MFRC522@^1.4.11
build_unflags = -Os
build_flags =
    -Os
    -flto
    -I../shared
    -Iinclude
    -DPC_NODE_FIRMWARE
    -DHSE_VALUE=8000000U
    -DENABLE_HWSERIAL1
    ; USB CDC console (SerialUSB) on PA11 / PA12, always on
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -DUSBCON
    -DUSBD_VID=0x0483
    -DUSBD_PID=0x5740
    -DUSB_MANUFACTURER="\"PressCounter\""
    -DUSB_PRODUCT="\"PressCounter counter\""
    -DHAL_PCD_MODULE_ENABLED
monitor_speed = 115200
; keep the application below the settings / lifetime-counter pages at 0x0800F800 (works on 64 KB and 128 KB chips)
board_upload.maximum_size = 63488

[env:stm32_stlink]
upload_protocol = stlink

[env:stm32_uart]
upload_protocol = serial
