<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Press counter setup</title>
<style>body{font:16px system-ui,sans-serif;margin:0;padding:18px;max-width:440px;margin:auto}h1{font-size:20px}label{display:block;margin:12px 0 4px;font-size:13px;color:#555}input,button{font:inherit;width:100%;padding:9px;box-sizing:border-box}button{margin-top:14px;background:#1f6feb;color:#fff;border:0;border-radius:6px}#m{margin-top:12px;color:#555}</style></head>
<body><h1>Press counter - WiFi setup</h1>
<p>Choose the WiFi network the counter should use. It reconnects by itself afterwards; this setup network switches off a few minutes later.</p>
<label>Network</label><input id="s" list="l" autocomplete="off"><datalist id="l"></datalist>
<label>Password</label><input id="p" type="password" autocomplete="off">
<button id="c">Connect</button><button id="n" style="background:#666">Scan networks</button><div id="m"></div>
<script>
const $=i=>document.getElementById(i);
$("n").onclick=async()=>{$("m").textContent="Scanning...";try{const r=await fetch("/api/scan");const a=await r.json();$("l").textContent="";a.forEach(x=>{const o=document.createElement("option");o.value=x.ssid;$("l").appendChild(o)});$("m").textContent=a.length+" networks found"}catch(e){$("m").textContent="Scan failed"}};
$("c").onclick=async()=>{try{const r=await fetch("/api/wifi",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({ssid:$("s").value,pass:$("p").value})});$("m").textContent=await r.text()}catch(e){$("m").textContent="Failed: "+e}};
$("n").click();
</script></body></html>
